<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尖塔 · 联机大厅</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#eee;font:16px system-ui;line-height:1.6}main{max-width:850px;margin:45px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:30px;color:#e5c57c;margin:0}p,.muted{color:#aab5c7}.card{background:#1a2130;border:1px solid #313d53;border-radius:14px;padding:24px;margin:18px 0}input,select,button,a.button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #485a76}input,select{background:#111824;color:#eee;max-width:100%}button,a.button{background:#d1af65;color:#171a20;cursor:pointer;text-decoration:none}button.secondary{background:#293449;color:#eee}button:disabled{opacity:.45;cursor:default}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}label{display:block;margin-bottom:9px}.code{font-size:30px;color:#e5c57c;letter-spacing:4px}.member{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #313d53}#error{color:#f6a5a5;white-space:pre-wrap}#runtime{font-size:14px;padding:12px;background:#202a3a;border-radius:8px}[hidden]{display:none!important}
</style>
<main><header><h1>尖塔 · 联机大厅</h1><span class="muted">游戏在服务器运行</span></header><p>创建房间，把房间码发给朋友。每个人在自己的网页中选角和出牌。</p><div id="error" role="alert"></div>
<section id="login" class="card" hidden><label>访问口令</label><form id="loginForm" class="row"><input id="password" type="password" autocomplete="current-password" required><button>进入大厅</button></form></section>
<section id="lobby" hidden><div id="runtime"></div><div id="actions"><div class="card"><label>你的昵称</label><input id="name" maxlength="24" placeholder="玩家昵称" value="玩家"></div><div class="card"><h2>创建房间</h2><div class="row"><select id="capacity" aria-label="房间人数"><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option></select><button id="create">创建房间</button></div></div><div class="card"><h2>加入朋友</h2><form id="joinForm" class="row"><input id="joinCode" placeholder="输入 6 位房间码" maxlength="6" required><button>加入房间</button></form></div></div><div id="room" class="card" hidden></div></section></main>
<script>
let csrf='',current=null,busy=false,previousRoom;const $=s=>document.querySelector(s),message=s=>$('#error').textContent=s||'';
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body)});if(!response.ok){const t=await response.text();let msg=t;try{msg=JSON.parse(t).error||t}catch{}throw Error(msg)}return response.json()}
function esc(text){const e=document.createElement('span');e.textContent=text;return e.innerHTML}
function render(room){const signature=JSON.stringify(room);if(signature===previousRoom)return;previousRoom=signature;current=room;$('#actions').hidden=!!room;$('#room').hidden=!room;if(!room)return;const labels={waiting:'等待朋友加入',starting:'正在准备游戏，请稍候…',playing:'游戏已就绪',failed:'游戏未能启动，请房主关闭房间后重试',closed:'房间已关闭'};$('#room').innerHTML=`<p>房间码</p><div class="code">${esc(room.code)}</div><p>${labels[room.state]||''} · ${room.members.length}/${room.capacity} 人</p>${room.members.map(m=>`<div class="member"><strong>${esc(m.name)}</strong><span>${m.owner?'房主':'玩家'}</span></div>`).join('')}<div class="row" style="margin-top:24px">${room.owner&&room.state==='waiting'?'<button id="start" '+(room.members.length<2?'disabled':'')+'>进入选角</button>':''}${room.play_url?'<a class="button" href="'+room.play_url+'">进入游戏</a>':''}<button id="leave" class="secondary">${room.owner?'关闭房间':'离开房间'}</button></div>`;if($('#start'))$('#start').onclick=()=>act(async()=>render(await api('/api/rooms/'+room.id+'/start',{})));$('#leave').onclick=()=>{if(room.owner&&!confirm('关闭这个房间？对局存档会保留。'))return;act(async()=>{await api('/api/rooms/'+room.id+'/leave',{});render(null)})}}
async function refresh(){try{const s=await api('/api/session');csrf=s.csrf;$('#login').hidden=true;$('#lobby').hidden=false;$('#runtime').textContent=s.runtime.ready?'游戏服务已就绪。':'游戏服务准备中，当前可以创建、加入房间；进入游戏需等待主机准备完成。';render(s.rooms[0]||null)}catch(e){if(e.message.includes('口令')||e.message.includes('登录')){$('#login').hidden=false;$('#lobby').hidden=true}else message(e.message)}}
async function act(fn){if(busy)return;busy=true;message('');try{await fn()}catch(e){message(e.message)}finally{busy=false}}
$('#loginForm').onsubmit=e=>{e.preventDefault();act(async()=>{const r=await api('/api/login',{password:$('#password').value});csrf=r.csrf;$('#password').value='';await refresh()})};
$('#create').onclick=()=>act(async()=>render(await api('/api/rooms',{name:$('#name').value,capacity:Number($('#capacity').value)})));
$('#joinForm').onsubmit=e=>{e.preventDefault();act(async()=>render(await api('/api/join',{code:$('#joinCode').value,name:$('#name').value})))};
setInterval(()=>{if(!busy&&!$('#lobby').hidden)refresh()},2500);refresh();
</script></html>
