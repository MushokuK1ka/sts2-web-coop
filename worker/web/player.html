<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>尖塔 · 网页联机</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10131b;color:#eee;font:14px system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;padding:8px 16px;background:#191f2c;min-height:46px}header strong{color:#e5c57c}#status{flex:1;color:#a6b2c6}button{background:#293348;border:1px solid #49566d;color:#eee;border-radius:7px;padding:7px 13px;cursor:pointer}
main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}canvas{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;outline:none}#hint{position:absolute;color:#a6b2c6;text-align:center;pointer-events:none}footer{padding:6px 12px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;background:#191f2c}footer button{padding:7px 16px}
</style>
<header><strong id="title">尖塔联机</strong><span id="status">正在连接…</span><button id="reconnect">重新连接</button><button id="fullscreen">全屏</button></header>
<main><canvas id="screen" tabindex="0"></canvas><div id="hint">等待主机游戏画面…<br>手机建议横屏游玩</div></main>
<footer><button data-key="Escape">返回 / 菜单</button><button data-key="m">地图</button><button data-key="d">牌组</button><button data-key="e">结束回合</button><button id="right">右键查看</button></footer>
<script>
const seat=location.pathname.split('/').pop(),key=new URLSearchParams(location.hash.slice(1)).get('key')||'',screen=document.querySelector('#screen'),ctx=screen.getContext('2d'),status=document.querySelector('#status'),hint=document.querySelector('#hint');
document.querySelector('#title').textContent=`尖塔联机 · 玩家 ${seat==='A'?'一':'二'}`;
let ws,pressed=false,right=false,lastMove=0,frames=0,lastFps=performance.now();
function send(data){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data))}
function connect(){
 if(ws)ws.close();
 status.textContent='正在连接…';
 ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/${seat}?key=${encodeURIComponent(key)}`);ws.binaryType='blob';
 ws.onopen=()=>{status.textContent='已连接，等待画面';screen.focus()};
 ws.onclose=()=>{status.textContent='连接已断开，点击重新连接';pressed=false};
 ws.onerror=()=>{status.textContent='连接失败：检查专属链接或关闭占用这个席位的页面'};
 ws.onmessage=async event=>{
   if(typeof event.data==='string'){const data=JSON.parse(event.data);if(!data.connected)status.textContent='等待主机启动游戏…';return}
   try{const image=await createImageBitmap(event.data);if(screen.width!==image.width||screen.height!==image.height){screen.width=image.width;screen.height=image.height}ctx.drawImage(image,0,0);image.close();hint.style.display='none';frames++;const now=performance.now();if(now-lastFps>1000){status.textContent=`已连接 · ${Math.round(frames*1000/(now-lastFps))} 帧/秒`;frames=0;lastFps=now}}
   finally{send({type:'ack'})}
 };
}
function position(event){const r=screen.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(event.clientY-r.top)/r.height))}}
screen.onpointerdown=event=>{event.preventDefault();screen.focus();screen.setPointerCapture(event.pointerId);pressed=true;send({type:'move',...position(event)});send({type:'down',button:right?2:event.button,...position(event)})};
screen.onpointermove=event=>{event.preventDefault();const now=performance.now();if(now-lastMove<16)return;lastMove=now;send({type:'move',...position(event)})};
screen.onpointerup=event=>{event.preventDefault();send({type:'move',...position(event)});send({type:'up',button:right?2:event.button,...position(event)});pressed=false;if(right){right=false;document.querySelector('#right').style.background=''}};
screen.onpointercancel=()=>{send({type:'release'});pressed=false};screen.oncontextmenu=e=>e.preventDefault();
screen.onwheel=event=>{event.preventDefault();send({type:'wheel',delta:event.deltaY,...position(event)})};
screen.onkeydown=event=>{if(event.ctrlKey||event.altKey||event.metaKey)return;event.preventDefault();if(!event.repeat)send({type:'key',key:event.key,pressed:true})};
screen.onkeyup=event=>{event.preventDefault();send({type:'key',key:event.key,pressed:false})};
window.addEventListener('blur',()=>send({type:'release'}));
document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>{send({type:'key',key:button.dataset.key,pressed:true});setTimeout(()=>send({type:'key',key:button.dataset.key,pressed:false}),90);screen.focus()});
document.querySelector('#right').onclick=()=>{right=!right;document.querySelector('#right').style.background=right?'#6d5730':''};
document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.querySelector('#reconnect').onclick=connect;
connect();
</script></html>
